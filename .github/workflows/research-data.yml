name: Research data download
on:
  push:
    branches: [research-data]
    paths: ['research-data/tickers.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas requests lxml
      - name: Download
        run: |
          python - <<'PY'
          import sys, time, pandas as pd
          sys.path.insert(0, '.')
          from signals.data import fetch_yahoo
          out = []
          for sym in open('research-data/tickers.txt').read().split():
              try:
                  if sym == 'HL_SNAPSHOT':
                      import requests, os, json
                      U='https://api.hyperliquid.xyz/info'
                      dexs=requests.post(U,json={'type':'perpDexs'},timeout=60).json()
                      out={'perpDexs':dexs,'ctx':{}}
                      names=['']+[d['name'] for d in dexs if d]
                      for n in names:
                          try: out['ctx'][n]=requests.post(U,json={'type':'metaAndAssetCtxs','dex':n},timeout=60).json()
                          except Exception as e: out['ctx'][n]=str(e)
                      os.makedirs('research-data/raw', exist_ok=True)
                      json.dump(out,open('research-data/raw/hl_snapshot.json','w')); print(sym,len(names)); continue
                  if sym == 'BITMEX_FUNDING':
                      import requests, os
                      rows, start = [], '2016-05-01'
                      for _ in range(40):
                          r = requests.get('https://www.bitmex.com/api/v1/funding', params={'symbol': 'XBTUSD', 'count': 500, 'startTime': start, 'reverse': 'false'}, timeout=60)
                          r.raise_for_status(); j = r.json()
                          if not j: break
                          rows += j; start = j[-1]['timestamp']
                          if len(j) < 500: break
                          time.sleep(2)
                      os.makedirs('research-data/raw', exist_ok=True)
                      pd.DataFrame(rows).to_csv('research-data/raw/bitmex_funding.csv', index=False); print(sym, len(rows)); continue
                  if sym == 'DERIBIT_FUNDING':
                      import requests, os
                      rows=[]; t0=pd.Timestamp('2019-05-01'); end=pd.Timestamp.utcnow().tz_localize(None)
                      while t0 < end:
                          t1=t0+pd.Timedelta(days=30)
                          r=requests.get('https://www.deribit.com/api/v2/public/get_funding_rate_history',params={'instrument_name':'BTC-PERPETUAL','start_timestamp':int(t0.timestamp()*1000),'end_timestamp':int(t1.timestamp()*1000)},timeout=60)
                          r.raise_for_status(); rows+=r.json()['result']; t0=t1; time.sleep(0.5)
                      os.makedirs('research-data/raw', exist_ok=True)
                      pd.DataFrame(rows).to_csv('research-data/raw/deribit_funding.csv', index=False); print(sym, len(rows)); continue
                  if sym.startswith('URL:'):
                      import requests, os
                      name, url = sym[4:].split('|', 1)
                      os.makedirs('research-data/raw', exist_ok=True)
                      r = requests.get(url, headers={'User-Agent': 'Mozilla/5.0 (research script)'}, timeout=120)
                      r.raise_for_status(); open('research-data/raw/' + name, 'wb').write(r.content)
                      print(sym, len(r.content)); continue
                  if sym.startswith('FRED:'):
                      import requests, io
                      v = None
                      for k in range(1):
                          try:
                              r = requests.get('https://fred.stlouisfed.org/graph/fredgraph.csv', params={'id': sym[5:]},
                                               headers={'User-Agent': 'Mozilla/5.0 (research script)'}, timeout=40)
                              r.raise_for_status(); x = pd.read_csv(io.StringIO(r.text)); x.columns = ['date', 'v']
                              x['date'] = pd.to_datetime(x['date']); v = pd.to_numeric(x.set_index('date')['v'], errors='coerce').dropna(); break
                          except Exception as e:
                              print('retry', sym, e); time.sleep(10)
                      if v is None: raise RuntimeError('FRED failed')
                      df = pd.DataFrame({'open': v, 'high': v, 'low': v, 'close': v, 'adj_close': v, 'volume': 0.0})
                      df.index.name = 'date'
                  else:
                      df = fetch_yahoo(sym, '1950-01-01')
                  df.insert(0, 'ticker', sym)
                  out.append(df); print(sym, len(df), df.index[0].date(), df.index[-1].date())
              except Exception as e:
                  print('FAILED', sym, e)
              time.sleep(1)
          pd.concat(out).to_csv('research-data/prices.csv', date_format='%Y-%m-%d')
          PY
      - name: Gamma probe
        run: python research-data/scripts/gamma_probe.py || true
      - name: Recent
        run: '[ -f research-data/recent.txt ] && python research-data/scripts/recent.py || true'
      - name: Breadth
        run: '[ -f research-data/breadth/skip ] || python research-data/scripts/breadth.py || true'
      - name: Extra
        run: python research-data/scripts/fetch_extra.py || true
      - name: Commit
        run: |
          git config user.name "signals-bot"; git config user.email "signals-bot@users.noreply.github.com"
          git add research-data/ && git commit -m "Research data" && git push
