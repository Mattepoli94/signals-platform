name: Signals (scheduled)

# Times are UTC. The code itself checks New York time, so US daylight-saving changes are handled.
on:
  schedule:
    - cron: '5 15 * * 1-5'    # London pre-close preview (16:05 UK in winter; the code checks London time)
    - cron: '5 16 * * 1-5'    # London pre-close preview (16:05 UK in summer)
    - cron: '55 16 * * 1-5'   # after the London close
    - cron: '55 17 * * 1-5'   # after the London close (backup; alerts are never sent twice)
    - cron: '20 21 * * 1-5'   # after the US close: value zones, dollar trend, daily summary
    - cron: '20 22 * * 1-5'   # after the US close (backup)
    - cron: '20 0 * * *'      # after the BTC daily close (00:00 UTC)
  push:
    branches: [main]
    paths: ['signals/**', 'config/**', 'research/**', 'requirements.txt', '.github/workflows/daily.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'preclose | close | us | btc | build'
        default: us
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "5 15 * * 1-5"|"5 16 * * 1-5") MODE=preclose ;;
            "55 16 * * 1-5"|"55 17 * * 1-5") MODE=close ;;
            "20 0 * * *") MODE=btc ;;
            "") MODE="${INPUT_MODE:-us}" ;;
            *) MODE=us ;;
          esac
          case "$MODE" in preclose|close|us|btc|build) ;; *) MODE=us ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: |
          set -o pipefail
          python -m signals run --mode ${{ steps.mode.outputs.mode }} 2>&1 | tee run.log
      - name: Save data and state
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data config state
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Data and signals: ${{ steps.mode.outputs.mode }} run $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Save the error for diagnosis
        if: failure()
        run: |
          mkdir -p state && tail -n 80 run.log > state/last_error.log 2>/dev/null || echo "no log" > state/last_error.log
          date -u +'failed %Y-%m-%d %H:%M UTC' >> state/last_error.log
          git config user.name "signals-bot"; git config user.email "signals-bot@users.noreply.github.com"
          git add state/last_error.log && git commit -m "Run failed: see state/last_error.log" && \
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Check site was built
        id: site
        run: if [ -f site/index.html ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.built == 'true'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: steps.site.outputs.built == 'true'
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    needs: run
    if: needs.run.outputs.built == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true          # fine if GitHub Pages is not enabled
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
